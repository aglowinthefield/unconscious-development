# Copy to .github/workflows/unconscious-tasks.yml in a project repo (`unconscious init` does).
#
# task-merged  on each push to the default branch, for every PR it merged that says `Refs #<issue>`
#              or names a task key: if every task of that issue now has a merged PR, marks the spec
#              `built`, removes its plan, and closes the issue, or moves it to `ud:verify` when the
#              spec has after-deploy criteria. Where the branch refuses a push, the spec change comes
#              as a PR instead; pass --via-pr to always do that.
#
# A PR opened with this job's GITHUB_TOKEN runs no workflows, so its checks never start. If your
# default branch needs checks to merge, add a repository secret UD_PR_TOKEN (a GitHub App or
# fine-grained token with pull-requests: write) and the PR is opened with it instead.
#
# A separate file from unconscious.yml because that one only runs on changes under docs/, and a
# task PR usually doesn't touch them.
name: unconscious tasks

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One run at a time, and every push waits its turn. Each run handles only the PRs its own push
# merged, so without `queue: max` GitHub cancels a waiting run when a newer one arrives, and that
# push's tasks are never marked done.
concurrency:
  group: unconscious-tasks
  cancel-in-progress: false
  queue: max

env:
  UD_REF: main

jobs:
  task-merged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: aglowinthefield/unconscious-development, ref: "${{ env.UD_REF }}", path: .ud }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .ud/bin/unconscious task-merged --base "$BEFORE" --head "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          UD_PR_TOKEN: ${{ secrets.UD_PR_TOKEN }}
